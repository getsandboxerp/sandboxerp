# Country Pack — Colombia
# Layers: 1 (country) + 2 (localization)
# Author: Hector Colina / Team360 <hector.colina@team360.cl>
# SPDX-License-Identifier: MIT

# ─────────────────────────────────────────
# meta
# ─────────────────────────────────────────
meta:
  code: co
  name: Colombia
  locale: es_CO          # Faker locale for names, addresses, etc.
  layers: [1, 2]

# ─────────────────────────────────────────
# localization  (Layer 2)
# ─────────────────────────────────────────
localization:
  odoo_modules:
    install_order:
      - l10n_co            # base: chart of accounts (PUC), taxes, fiscal positions
  chart_of_accounts: l10n_co
  currency: COP
  language: es_CO
  country_code: CO
  post_install:
    - set_currency: COP
    - set_language: es_CO
    - set_country: CO

# ─────────────────────────────────────────
# fiscal  (Layer 1)
# ─────────────────────────────────────────
fiscal:
  tax_name: IVA
  tax_rate: 0.19
  tax_account: IVA generado
  id_label: NIT
  id_format: "XXXXXXXXX-D"          # 9 digits + hyphen + verification digit
  vat_format: "__generator__"       # vat_generators._co_nit
  faker_person_id: ssn              # fallback — NIT generated by _co_nit
  faker_company_id: ssn             # fallback — NIT generated by _co_nit

# ─────────────────────────────────────────
# partner_fields
# CO uses l10n_latam for identification types.
# NIT is stored without country prefix in Odoo CO — the format
# XXXXXXXXX-D is stored directly in the vat field.
# identification_type_name is resolved at runtime via
# l10n_latam.identification.type search — no hardcoded IDs.
# ─────────────────────────────────────────
partner_fields:
  vat_prefix: ""                         # NIT needs no country prefix in Odoo CO
  identification_type_name: "NIT"        # looked up in l10n_latam.identification.type
  company_taxpayer_field: ""
  company_taxpayer_value: ""
  person_taxpayer_field: ""
  person_taxpayer_value: ""


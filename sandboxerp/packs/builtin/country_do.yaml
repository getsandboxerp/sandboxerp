# Country Pack — Dominican Republic
# Layers: 1 (country) + 2 (localization)
# Author: Hector Colina / Team360 <hector.colina@team360.cl>
# SPDX-License-Identifier: MIT

# ─────────────────────────────────────────
# meta
# ─────────────────────────────────────────
meta:
  code: do
  name: Dominican Republic
  # Faker has no es_DO locale. es_MX is the fallback: Spanish names and a
  # NANP-style phone format, which is the numbering plan the Dominican
  # Republic uses. Addresses come from this pack, not from Faker.
  locale: es_MX
  layers: [1, 2]

# ─────────────────────────────────────────
# localization  (Layer 2)
# ─────────────────────────────────────────
localization:
  odoo_modules:
    install_order:
      - l10n_do            # base: chart of accounts, ITBIS taxes, fiscal positions
  chart_of_accounts: l10n_do
  currency: DOP
  language: es_DO       # the installer currently applies meta.locale (es_MX) instead
  country_code: DO
  post_install:
    - set_currency: DOP
    - set_language: es_DO
    - set_country: DO

# ─────────────────────────────────────────
# fiscal  (Layer 1)
# ─────────────────────────────────────────
fiscal:
  tax_name: ITBIS
  tax_rate: 0.18                    # general rate; reduced rate is 16 percent
  tax_account: ITBIS por pagar
  id_label: RNC
  id_format: "XXXXXXXXX"            # 9 digits, no separators
  vat_format: "__generator__"       # vat_generators._do_rnc
  faker_person_id: ssn              # fallback — RNC generated by _do_rnc
  faker_company_id: ssn             # fallback — RNC generated by _do_rnc

# ─────────────────────────────────────────
# partner_fields
# Verified on Odoo 17 + l10n_do: the vat field takes the bare 9-digit RNC
# (no prefix). res.partner has no l10n_latam or l10n_do fields there, so
# identification_type_name below is ignored and kept only for pack structure.
# ─────────────────────────────────────────
partner_fields:
  vat_prefix: ""                         # RNC stored bare, without country prefix
  identification_type_name: "RNC"        # ignored on Odoo 17 + l10n_do (no such field)
  company_taxpayer_field: ""
  company_taxpayer_value: ""
  person_taxpayer_field: ""
  person_taxpayer_value: ""

# ─────────────────────────────────────────
# banks  (SWIFT codes checked against public SWIFT directories;
#         "code" is an internal sequence, not an official bank code)
# ─────────────────────────────────────────

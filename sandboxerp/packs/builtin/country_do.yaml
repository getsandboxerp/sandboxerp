    name: Banco de Reservas de la República Dominicana
    short: Banreservas
    swift: BRRDDOSD
  - code: "002"
    name: Banco Popular Dominicano
    short: Popular
    swift: BPDODOSX
  - code: "003"
    name: Banco Múltiple BHD
    short: BHD
    swift: BCBHDOSD
  - code: "004"
    name: Banesco Banco Múltiple
    short: Banesco
    swift: BANSDOSD
  - code: "005"
    name: Banco Múltiple Vimenca
    short: Vimenca
    swift: VIMEDOSD
  - code: "006"
    name: Banco Atlántico de Ahorro y Crédito
    short: Atlántico
    swift: BAACDOSD
  - code: "007"
    name: Banco Óptima de Ahorro y Crédito
    short: Óptima
    swift: OPARDOSD
  - code: "008"
    name: Banco Agrícola de la República Dominicana
    short: Agrícola
    swift: BAGRDOSA

